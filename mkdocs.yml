site_name: JSK Knowledge Base
site_url: https://javvadigithub.github.io/jskb/
site_description: Personal technical notes on security, networking, and infrastructure.
site_author: Srikanth Javvadi

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: teal
    - scheme: default
      primary: blue grey
      accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.integrate

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - CEH Modules:
      - Module 01: ceh/01-introduction.md
  - Labs:
      - Overview: labs/index.md
  - Networking:
      - Overview: docs/networking/index.md
      - Nmap Cheat Sheet: docs/networking/nmap.md
  - Linux:
      - Overview: linux/index.md
  - Infra Notes:
      - Overview: infra/index.md